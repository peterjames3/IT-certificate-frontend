# .github/workflows/frontend-ci.yml
#
# Runs on every push to main and every pull request.
# Catches type errors and build failures before Vercel deploys.
# Vercel handles the actual deployment automatically via its GitHub integration.

name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type check & build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Setup Node.js with npm cache
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies (uses package-lock.json for exact versions)
      - name: Install dependencies
        run: npm ci

      # 4. Type check — catches TS errors without emitting files
      - name: Type check
        run: npx tsc --noEmit

      # 5. Build — ensures the Next.js build succeeds
      #    Add any required NEXT_PUBLIC_ env vars your build needs below
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000